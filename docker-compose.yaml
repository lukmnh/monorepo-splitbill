services:
  postgres:
    image: postgres:16-alpine
    container_name: splitbill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: splitbill
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-anime021}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d splitbill"]
      interval: 10s
      timeout: 5s
      retries: 5

  group-service:
    build:
      context: .
      dockerfile: group-service/DockerFile
    container_name: splitbill-group-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/splitbill
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-anime021}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  expense:
    build:
      context: .
      dockerfile: expense/DockerFile
    container_name: splitbill-expense
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/splitbill
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-anime021}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  settlement:
    build:
      context: .
      dockerfile: settlement/DockerFile
    container_name: splitbill-settlement
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/splitbill
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-anime021}
      SERVICES_EXPENSE-SERVICE_URL: http://expense:8082
    depends_on:
      postgres:
        condition: service_healthy
      expense:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  postgres_data: